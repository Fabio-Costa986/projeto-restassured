name: API Tests — ServeRest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1-5'   # segunda a sexta às 06h UTC

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'oracle'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Rodar Smoke Tests
        run: mvn test -Dgroups="smoke" --no-transfer-progress

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'oracle'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Rodar Regression Tests
        run: mvn test -Dgroups="regression" --no-transfer-progress

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results

  report:
    name: Publicar Allure Report
    runs-on: ubuntu-latest
    needs: [smoke, regression]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Smoke Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results

      - name: Download Regression Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results

      - name: Publicar Allure Report no GitHub Pages
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
