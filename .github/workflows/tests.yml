name: API Tests — ServeRest

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:       # permite rodar manualmente pela UI do GitHub
  schedule:
    - cron: '0 6 * * 1-5' # segunda a sexta às 06h UTC

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Rodar Smoke Tests
        run: mvn test -Dgroups="smoke" --no-transfer-progress

      - name: Upload Allure Results (Smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results
          retention-days: 7

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Rodar Regression Tests
        run: mvn test -Dgroups="regression" --no-transfer-progress

      - name: Upload Allure Results (Regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results
          retention-days: 7

  report:
    name: Gerar e Publicar Allure Report
    runs-on: ubuntu-latest
    needs: [smoke, regression]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Download Smoke Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results

      - name: Download Regression Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results

      - name: Copiar categories.json para allure-results
        run: cp src/test/resources/categories.json target/allure-results/categories.json

      - name: Gerar Allure Report
        run: mvn allure:report --no-transfer-progress

      - name: Upload Allure Report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
